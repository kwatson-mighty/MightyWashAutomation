# Copy this file into your automation repo at:
#   .github/workflows/inbox-ascent.yml
#
# Runs at 8:00 AM and 4:00 PM Central Time.
# NOTE: GitHub Actions cron is UTC only and does not shift for daylight saving.
#   13:00 / 21:00 UTC = 8am / 4pm CDT (roughly Mar–Nov)
#   14:00 / 22:00 UTC = 8am / 4pm CST (roughly Nov–Mar)
# Both are scheduled below so you stay on time year-round; the job just
# no-ops (finds nothing new) on the pair that's off by an hour... actually
# it WILL still run and process mail, just an hour earlier/later than ideal
# for half the year. Simplest fix twice a year: delete/re-add the CST or
# CDT lines below, or just leave both — worst case you get an extra check-in.

name: Inbox Ascent

on:
  schedule:
    - cron: "0 13 * * *"  # ~8am CDT
    - cron: "0 21 * * *"  # ~4pm CDT
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

jobs:
  run-inbox-ascent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r Inbox_Ascent/requirements.txt

